repos:
  # ---------------------------------------------------------------------------
  # Basic pre-commit checks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      # Test fixtures are byte-exact on purpose: pairs.txt carries ragged
      # trailing tabs and several files deliberately lack a final newline, so
      # the parsers are exercised against real-world messy input.
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: trailing-whitespace
        exclude: ^tests/data/
  # ---------------------------------------------------------------------------
  # Python: Ruff formatting checks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format
  # ---------------------------------------------------------------------------
  # Python tests (run at pre-push stage — requires the extension to be built)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        description: Run the full Python test suite before pushing.
        entry: pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
  # ---------------------------------------------------------------------------
  # Python: numpydoc docstring validation
  # ---------------------------------------------------------------------------
  - repo: https://github.com/numpy/numpydoc
    rev: v1.9.0
    hooks:
      - id: numpydoc-validation
        # _version.py is generated by hatch-vcs and has no docstrings.
        exclude: (tests/|docs/|src/corset_tools/_version\.py)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
